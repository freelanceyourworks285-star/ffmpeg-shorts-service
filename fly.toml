# Railway: just connect this repo on railway.app, it auto-detects the Dockerfile.
# Set env var API_KEY to a long random string.

# Fly.io: install flyctl, then:
#   fly launch --no-deploy
#   fly secrets set API_KEY=$(openssl rand -hex 32)
#   fly deploy

app = "ffmpeg-shorts-service"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "30s"
interval = "30s"
method = "GET"
timeout = "10s"
path = "/health"

[[vm]]
memory_mb = 1024
cpu_kind = "shared"
cpus = 1
